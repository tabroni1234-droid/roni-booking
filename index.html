<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roni Fitness Factory | 專屬預約</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+TC:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* Roni V9.3 (2026 Full Year + 10-22 Time Slots) */
        :root {
            --bg-color: #080808;
            --card-bg: #101010;
            --primary-gold: #C8AA6E;
            --text-main: #E0E0E0;
            --text-muted: #888888;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Noto Serif TC', serif;
            margin: 0; padding: 20px;
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
        }

        .container {
            width: 100%; max-width: 420px;
            background: var(--card-bg);
            padding: 50px 40px;
            border: 1px solid rgba(200, 170, 110, 0.2);
            box-shadow: 0 40px 80px rgba(0,0,0,0.9);
            position: relative;
            overflow: hidden;
            background-image: url("https://www.transparenttextures.com/patterns/black-linen.png");
            min-height: 600px;
        }

        .corner { position: absolute; width: 15px; height: 15px; border: 1px solid var(--primary-gold); }
        .tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
        .tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
        .bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
        .br { bottom: 10px; right: 10px; border-left: none; border-top: none; }

        header { text-align: center; margin-bottom: 30px; z-index: 2; position: relative; }
        .logo-box { width: 80px; height: 80px; margin: 0 auto 15px; display: flex; justify-content: center; align-items: center; }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 2px solid var(--primary-gold); padding: 3px; }

        h1 { font-family: 'Cinzel', serif; font-size: 20px; color: var(--primary-gold); margin: 0; letter-spacing: 2px; }
        .subtitle {
            font-family: 'Noto Serif TC', serif; font-size: 13px; color: var(--text-muted);
            border-top: 1px solid #333; border-bottom: 1px solid #333;
            display: inline-block; padding: 8px 15px; margin-top: 5px;
        }

        .step { display: none; animation: fadeIn 0.5s ease; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .form-group { margin-bottom: 25px; }
        label { display: block; font-size: 13px; color: var(--primary-gold); margin-bottom: 8px; letter-spacing: 1px; }

        input, select {
            width: 100%; padding: 10px 0;
            background: transparent; border: none;
            border-bottom: 1px solid #444;
            color: #fff; font-family: 'Noto Serif TC', serif; font-size: 16px;
            outline: none; border-radius: 0; appearance: none;
        }
        input:focus, select:focus { border-bottom-color: var(--primary-gold); }

        .hidden-block { display: none; margin-top: 10px; }

        /* 時間按鈕樣式 */
        .time-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .time-btn {
            padding: 12px 5px;
            background: rgba(255,255,255,0.05);
            border: 1px solid #444;
            color: #aaa;
            font-family: 'Cinzel', serif; font-size: 14px;
            text-align: center; cursor: pointer; transition: 0.3s;
            border-radius: 4px;
        }

        .time-btn.selected {
            background: var(--primary-gold); color: #000;
            border-color: var(--primary-gold); font-weight: bold;
            box-shadow: 0 0 10px rgba(200, 170, 110, 0.4);
        }
        
        /* 被預約的按鈕直接隱藏 */
        .time-btn.hidden {
            display: none !important;
        }

        .time-btn:not(.hidden):not(.selected):hover {
            border-color: var(--primary-gold); color: var(--primary-gold);
        }

        .btn-group { margin-top: 40px; display: flex; gap: 15px; }
        button {
            flex: 1; padding: 15px;
            background: transparent; border: 1px solid var(--primary-gold);
            color: var(--primary-gold); font-family: 'Cinzel', serif; font-weight: 700;
            cursor: pointer; transition: 0.3s;
        }
        button.primary { background: var(--primary-gold); color: #000; }
        button:active { transform: scale(0.98); }

        .time-note {
            font-size: 11px; color: #666; margin-top: 15px; 
            border: 1px solid #333; padding: 10px; border-radius: 4px; line-height: 1.6;
        }
        
        .success-icon { text-align: center; font-size: 50px; color: var(--primary-gold); margin-bottom: 20px; }
        .summary-box { background: rgba(255,255,255,0.05); padding: 20px; border: 1px solid #333; margin-bottom: 25px; }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; border-bottom: 1px dashed #333; padding-bottom: 5px; }
        .s-val { color: var(--primary-gold); text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>

    <header>
        <div class="logo-box">
            <img src="avatar.png" alt="Roni" onerror="this.style.display='none';">
        </div>
        <h1>Roni Fitness Factory</h1>
        <div class="subtitle">健身工廠嘉義、民雄皆有服務</div>
    </header>

    <form id="bookingForm">
        <div class="step active" id="step1">
            <div class="form-group">
                <label>貴賓姓名 / NAME</label>
                <input type="text" name="name" id="inputName" required placeholder="請輸入您的全名">
            </div>
            <div class="form-group">
                <label>性別 / GENDER</label>
                <select name="gender" id="inputGender" required>
                    <option value="" disabled selected>請選擇</option>
                    <option value="男">男 (Male)</option>
                    <option value="女">女 (Female)</option>
                </select>
            </div>
            <div class="form-group">
                <label>聯絡電話 / PHONE</label>
                <input type="tel" name="phone" id="inputPhone" required placeholder="09xx-xxx-xxx">
            </div>
            <div class="form-group">
                <label>諮詢廠館 / LOCATION</label>
                <select name="factory" id="inputFactory" required>
                    <option value="" disabled selected>請選擇預約廠館</option>
                    <option value="健身工廠民雄廠">健身工廠 - 民雄廠</option>
                    <option value="健身工廠嘉義廠">健身工廠 - 嘉義廠</option>
                </select>
            </div>
            <div class="btn-group">
                <button type="button" class="primary" onclick="goToStep(2)">NEXT STEP</button>
            </div>
        </div>

        <div class="step" id="step2">
            <div class="form-group">
                <label>預約目的 / PURPOSE</label>
                <select name="purpose" id="inputPurpose" required onchange="checkMemo(this.value)">
                    <option value="參觀入會">參觀入會</option>
                    <option value="續約/重新加入">續約/重新加入</option>
                    <option value="資料補齊">資料補齊</option>
                    <option value="其他諮詢">其他諮詢</option>
                </select>
            </div>

            <div class="form-group hidden-block" id="memoGroup">
                <label>備註 / MEMO (必填)</label>
                <input type="text" name="memo" id="inputMemo" placeholder="請簡述您的需求...">
            </div>

            <div class="form-group">
                <label>預約日期 / DATE</label>
                <select name="dateSelect" id="dateSelect" required>
                    <option value="">讀取可預約時段...</option>
                </select>
            </div>

            <div class="form-group">
                <label>預約時段 / TIME</label>
                <div id="timeGrid" class="time-grid">
                    <div style="grid-column: span 3; text-align:center; color:#555; font-size:12px;">請先選擇日期</div>
                </div>
                <input type="hidden" name="timeSelect" id="timeSelectInput" required>
                
                <div class="time-note">
                    * 若時段未顯示，代表已被預約或時間已過。<br>
                    * 欲選擇其他時段請私訊 Roni 官方 Line，當天將交由同事協助。
                </div>
            </div>

            <div class="btn-group">
                <button type="button" onclick="goToStep(1)">BACK</button>
                <button type="submit" class="primary" id="submitBtn">CONFIRM</button>
            </div>
        </div>

        <div class="step" id="step3">
            <div class="success-icon"><i class="fa-regular fa-circle-check"></i></div>
            <div style="text-align:center; margin-bottom:20px; font-weight:bold;">恭喜您預約完成！</div>
            <div class="summary-box" id="summaryContent"></div>
            
            <div class="btn-group" style="flex-direction:column;">
                <button type="button" class="primary" onclick="copyInfo()">複製到剪貼簿</button>
                <button type="button" onclick="addToCalendar()">加入 Google 行事曆</button>
            </div>
            <div style="text-align:center; font-size:12px; color:#666; margin-top:15px;">
                建議您將資訊貼至 TimeTree 或設定鬧鐘提醒
            </div>
        </div>
    </form>
</div>

<script>
    // ==========================================
    // ⚙️ 系統設定
    // ==========================================
    const CONFIG = {
        discordUrl: "https://discordapp.com/api/webhooks/1449799845144559731/pTkKrAfV2NlUayLtBqN2nNLAXj5ktq_6cXsYwEgrZCWjCFw7j8dFscCG7kVmyrhAlLps",
        googleScriptUrl: "https://script.google.com/macros/s/AKfycbyBNTeC51u7lKbzx_BOFqNwgTwkMoA0HFLN4aOxUPSUaRtErAmtrS-Ml5oM_F9oYCx-EQ/exec",
        lineUrl: "https://line.me/ti/p/@781uizhn",
        
        // 日期範圍：2026全年
        limitDate: "2026-12-31"
    };

    let BOOKED_SLOTS = [];

    // 初始化：抓取資料
    window.onload = function() { fetchBookedSlots(); };

    function fetchBookedSlots() {
        const dateSel = document.getElementById('dateSelect');
        dateSel.innerHTML = '<option>正在與雲端同步...</option>';

        fetch(CONFIG.googleScriptUrl)
            .then(response => response.json())
            .then(data => {
                BOOKED_SLOTS = data;
                initCalendar();
            })
            .catch(error => { 
                console.error("連線錯誤:", error); 
                alert("無法讀取預約資料，請檢查網路狀態。");
                initCalendar(); 
            });
    }

    function checkMemo(val) {
        const block = document.getElementById('memoGroup');
        const input = document.getElementById('inputMemo');
        if (val === '其他諮詢') { block.style.display = 'block'; input.required = true; }
        else { block.style.display = 'none'; input.required = false; input.value = ''; }
    }

    function goToStep(step) {
        if(step === 2) {
            const name = document.getElementById('inputName').value.trim();
            const phone = document.getElementById('inputPhone').value.trim();
            const factory = document.getElementById('inputFactory').value;

            if(!name || !phone || !factory) {
                alert("請完整填寫基本資料"); 
                return;
            }
            const purePhone = phone.replace(/\D/g, '');
            if (purePhone.length < 10) {
                alert("⚠️ 手機號碼格式錯誤\n\n請輸入完整號碼 (至少 10 碼數字)");
                return;
            }
        }
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById(`step${step}`).classList.add('active');
    }

    // --- 日期與時間處理 (核心修改處) ---
    const dateSelect = document.getElementById('dateSelect');
    const timeGrid = document.getElementById('timeGrid');
    const timeInput = document.getElementById('timeSelectInput');

    function initCalendar() {
        dateSelect.innerHTML = '<option value="">請選擇日期</option>';
        
        const now = new Date();
        now.setHours(0,0,0,0);
        
        const targetYear = 2026;
        const weekDays = ['日','一','二','三','四','五','六'];
        
        const startDate = new Date(targetYear, 0, 1);
        const endDate = new Date(targetYear, 11, 31);
        
        for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
            // 隱藏過去日期
            if (d < now) { continue; }

            const yyyy = d.getFullYear();
            const mm = (d.getMonth()+1).toString().padStart(2,'0');
            const dd = d.getDate().toString().padStart(2,'0');
            const dateStr = `${yyyy}-${mm}-${dd}`;
            
            const opt = document.createElement('option');
            opt.value = dateStr;
            opt.innerText = `${yyyy}/${mm}/${dd} (${weekDays[d.getDay()]})`;
            dateSelect.appendChild(opt);
        }
    }

    function initTime() {
        const dateVal = dateSelect.value;
        timeGrid.innerHTML = '';
        timeInput.value = '';

        if(!dateVal) {
            timeGrid.innerHTML = '<div style="grid-column: span 3; text-align:center; color:#555; font-size:12px;">請先選擇日期</div>';
            return;
        }

        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = (now.getMonth()+1).toString().padStart(2,'0');
        const dd = now.getDate().toString().padStart(2,'0');
        const todayStr = `${yyyy}-${mm}-${dd}`;
        const currentHour = now.getHours();

        const isToday = (dateVal === todayStr);

        // 🟢 修改處：固定從 10:00 到 22:00
        const startH = 10;
        const endH = 22;

        for(let h = startH; h <= endH; h++) {
            const timeStr = `${h.toString().padStart(2,'0')}:00`;
            const fullSlot = `${dateVal} ${timeStr}`;
            
            const btn = document.createElement('div');
            btn.className = 'time-btn';
            btn.innerText = timeStr;
            
            const isBooked = BOOKED_SLOTS.some(slot => slot.includes(fullSlot));
            // 如果是今天，且時間已過(小於等於目前小時)，則隱藏
            const isPassedTime = isToday && (h <= currentHour);

            if (isBooked || isPassedTime) {
                btn.classList.add('hidden');
            } else {
                btn.onclick = function() {
                    document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    timeInput.value = timeStr;
                };
                timeGrid.appendChild(btn);
            }
        }
        
        if (timeGrid.querySelectorAll('.time-btn:not(.hidden)').length === 0) {
            timeGrid.innerHTML = '<div style="grid-column: span 3; text-align:center; color:#d9534f; font-size:12px;">本日時段已滿或已過</div>';
        }
    }
    
    dateSelect.addEventListener('change', initTime);

    // --- 送出 ---
    const form = document.getElementById('bookingForm');
    form.addEventListener('submit', e => {
        e.preventDefault();
        
        if(!timeInput.value) { alert("請點擊選擇一個預約時段"); return; }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "處理中...";

        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        const fullDateTime = `${data.dateSelect} ${timeInput.value}`;
        
        formData.append("date", fullDateTime);
        formData.set("phone", "'" + data.phone);

        const discordPayload = {
            username: "Roni 預約管家",
            embeds: [{
                title: "💎 新的預約成立",
                color: 13146734,
                fields: [
                    { name: "貴賓", value: `${data.name} (${data.gender})`, inline: true },
                    { name: "電話", value: data.phone, inline: true },
                    { name: "廠館", value: data.factory, inline: true },
                    { name: "時間", value: fullDateTime, inline: false },
                    { name: "項目", value: data.purpose, inline: true },
                    { name: "備註", value: data.memo || "無", inline: false }
                ]
            }]
        };

        Promise.all([
            fetch(CONFIG.discordUrl, { 
                method: "POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(discordPayload)
            }).catch(()=>{}),
            fetch(CONFIG.googleScriptUrl, { method: 'POST', body: formData }).catch(()=>{})
        ]).then(() => {
            renderSuccess(data, fullDateTime);
            goToStep(3);
        });
    });

    function renderSuccess(data, time) {
        const box = document.getElementById('summaryContent');
        box.innerHTML = `
            <div class="summary-item"><span>姓名</span><span class="s-val">${data.name}</span></div>
            <div class="summary-item"><span>電話</span><span class="s-val">${data.phone}</span></div>
            <div class="summary-item"><span>廠館</span><span class="s-val">${data.factory}</span></div>
            <div class="summary-item"><span>時間</span><span class="s-val">${time}</span></div>
            <div class="summary-item"><span>項目</span><span class="s-val">${data.purpose}</span></div>
            <div class="summary-item"><span>備註</span><span class="s-val">${data.memo || '-'}</span></div>
        `;
    }

    function copyInfo() {
        const items = document.querySelectorAll('.summary-item');
        let text = "【Roni 預約確認】\n";
        items.forEach(item => { text += `${item.children[0].innerText}：${item.children[1].innerText}\n`; });
        navigator.clipboard.writeText(text).then(() => alert("已複製！"));
    }

    function addToCalendar() {
        const date = document.getElementById('dateSelect').value.replace(/-/g,'');
        const time = timeInput.value.replace(/:/g,'');
        const start = `${date}T${time}00`;
        const end = `${date}T${parseInt(time)+100}00`;
        const details = `預約廠館：${document.getElementById('inputFactory').value}`;
        window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=Roni健體諮詢&dates=${start}/${end}&details=${details}`, '_blank');
    }
</script>

</body>
</html>
